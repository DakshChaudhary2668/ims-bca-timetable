[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ims-timetable-scheduler"
version = "0.1.0"
description = "Pure Python CP-SAT proposal engine for IMS BCA timetables"
requires-python = ">=3.12"
dependencies = ["ortools>=9.12,<10", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.14,<1"]

[project.scripts]
ims-scheduler = "scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scheduler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
